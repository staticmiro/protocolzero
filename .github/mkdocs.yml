site_name: Protocol Zero
site_description: A comprehensive guide to digital privacy, security, and sovereignty for everyone
site_author: Protocol Zero Contributors
site_url: ""

repo_name: protocolzero/protocolzero
repo_url: https://github.com/protocolzero/protocolzero

docs_dir: ../protocol

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
    logo: material/shield-lock

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/protocolzero/protocolzero
  alternate:
    - name: English
      link: /en/
      lang: en
    - name: Polski
      link: /pl/
      lang: pl
    - name: Deutsch
      link: /de/
      lang: de
    - name: Español
      link: /es/
      lang: es
    - name: Français
      link: /fr/
      lang: fr
    - name: Русский
      link: /ru/
      lang: ru
    - name: 中文
      link: /zh/
      lang: zh
    - name: 日本語
      link: /ja/
      lang: ja

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
  - attr_list
  - md_in_html

plugins:
  - search:
      lang: 
        - en
        - pl
        - de
        - es
        - fr
        - ru
        - zh
        - ja
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: pl
          name: Polski
          build: false
        - locale: de
          name: Deutsch
          build: false
        - locale: es
          name: Español
          build: false
        - locale: fr
          name: Français
          build: false
        - locale: ru
          name: Русский
          build: false
        - locale: zh
          name: 中文
          build: false
        - locale: ja
          name: 日本語
          build: false

nav:
  - Home: en/README.md
  - Parts:
      - "I: Foundations": en/01_foundations.md
      - "II: Identity & Access": en/02_identity_and_access.md
      - "III: Device Security": en/03_device_security.md
      - "IV: Archive - Data & Memories": en/04_archive_data_and_memories.md
      - "V: Communication & Privacy": en/05_communication_and_privacy.md
      - "VI: Digital Finances": en/06_digital_finances.md
      - "VII: AI & Automation": en/07_ai_and_automation.md
      - "VIII: Law & Ethics": en/08_law_and_ethics.md
      - "IX: Family & Children": en/09_family_and_children.md
      - "X: Work & Travel": en/10_work_and_travel.md
      - "XI: Digital Legacy": en/11_digital_legacy.md
      - "XII: Digital Hygiene & Wellbeing": en/12_digital_hygiene_and_wellbeing.md
  - Appendices:
      - "A: Tools - Essential List": en/a_tools_essential_list.md
      - "B: Crisis Scenarios - First Aid": en/b_crisis_scenarios_first_aid.md
      - "C: Printable Checklists": en/c_printable_checklists.md
      - "D: Templates": en/d_templates.md
      - "E: Extended Glossary": en/e_extended_glossary.md
      - "F: Versioning & Maintenance": en/f_versioning_and_maintenance_plan.md

