name: "🌍 Translation Proposal"
description: Propose or coordinate translation to a new language
title: "[TRANSLATION] "
labels: ["translation", "help-wanted"]
body:
  - type: markdown
    attributes:
      value: |
        ## Translation Proposal
        
        Want to translate Protocol Zero to your language? Use this template to coordinate translation efforts.
        
        **Before starting:** Check existing translation proposals to avoid duplicate work.
        
  - type: input
    id: language
    attributes:
      label: Target Language
      description: "Which language? (e.g., Polski, Español, 中文)"
      placeholder: "Language name and code (e.g., Polski - pl)"
    validations:
      required: true
      
  - type: dropdown
    id: translation-stage
    attributes:
      label: Translation Stage
      description: What's your plan?
      options:
        - Proposing - want to start translation
        - In Progress - actively translating
        - Review Needed - translation draft ready
        - Complete - ready to merge
    validations:
      required: true
      
  - type: textarea
    id: progress
    attributes:
      label: Progress & Plan
      description: |
        What have you translated so far?
        What's your timeline?
        Do you need collaborators?
      placeholder: |
        - [ ] README.md
        - [ ] 01_foundations.md
        - [ ] 02_identity_and_access.md
        ...
    validations:
      required: true
      
  - type: checkboxes
    id: guidelines
    attributes:
      label: Translation Guidelines
      description: Confirm you've read the guidelines
      options:
        - label: I have read CONTRIBUTING.md translation section
          required: true
        - label: I will maintain the same structure as English version
          required: true
        - label: I will adapt examples for local context when appropriate
          required: false
          
  - type: textarea
    id: help-needed
    attributes:
      label: Help Needed
      description: Do you need help from other translators or reviewers?
      placeholder: "Looking for co-translators, proofreaders, technical terminology help..."
    validations:
      required: false