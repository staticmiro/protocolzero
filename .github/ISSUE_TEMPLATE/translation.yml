name: 🌍 Translation Request/Update
description: Request a new translation or report issues with existing translations
title: "[TRANSLATION]: "
labels: ["translation", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        Help make Protocol Zero accessible to more people around the world!
        
  - type: dropdown
    id: type
    attributes:
      label: Type of request
      options:
        - New language translation
        - Update existing translation
        - Report translation error
        - Volunteer to translate
    validations:
      required: true

  - type: input
    id: language
    attributes:
      label: Language
      description: Which language? (Include language code if known, e.g., pt-BR for Brazilian Portuguese)
      placeholder: "Portuguese (pt) or Portuguese (Brazil) (pt-BR)"
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Provide details about your request
      placeholder: |
        For new translations: Why is this language important? Estimated user base?
        For errors: What's incorrect and what should it say?
        For volunteering: Your background and translation experience?
    validations:
      required: true

  - type: input
    id: file
    attributes:
      label: File reference (if applicable)
      description: For error reports, which file is affected?
      placeholder: "protocol/es/02_identity_and_access.md"

  - type: checkboxes
    id: volunteer-scope
    attributes:
      label: If volunteering, what can you commit to?
      options:
        - label: Full translation (all 19 files)
        - label: Partial translation (priority files only)
        - label: Review/proofreading of existing translation
        - label: Ongoing maintenance of translation