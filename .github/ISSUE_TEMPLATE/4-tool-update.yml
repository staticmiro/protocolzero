name: "🔧 Tool/Software Update"
description: Report outdated tool recommendations in Appendix A
title: "[TOOL UPDATE] "
labels: ["tool-update", "appendix-a"]
body:
  - type: markdown
    attributes:
      value: |
        ## Tool Recommendation Update
        
        Appendix A contains specific tool recommendations that need regular updates. Use this template to report changes.
        
  - type: dropdown
    id: update-type
    attributes:
      label: Type of Update
      description: What needs updating?
      options:
        - Tool is discontinued/shut down
        - Tool had security breach
        - Better alternative available
        - Pricing changed significantly
        - New tool recommendation
        - Remove outdated recommendation
    validations:
      required: true
      
  - type: input
    id: tool-name
    attributes:
      label: Tool Name
      description: "Which tool does this concern?"
      placeholder: "e.g., LastPass, Bitwarden, Signal"
    validations:
      required: true
      
  - type: input
    id: category
    attributes:
      label: Category in Appendix A
      description: "Which section? (e.g., Password Managers, VPN, Backup)"
      placeholder: "Category from Appendix A"
    validations:
      required: true
      
  - type: textarea
    id: current-status
    attributes:
      label: Current Status in Protocol Zero
      description: What does the document currently say about this tool?
      placeholder: "Copy the current description from Appendix A..."
    validations:
      required: false
      
  - type: textarea
    id: what-changed
    attributes:
      label: What Changed?
      description: What's the new information?
      placeholder: |
        - What happened?
        - When did this change occur?
        - Links to sources (news, official announcements, etc.)
    validations:
      required: true
      
  - type: textarea
    id: recommendation
    attributes:
      label: Your Recommendation
      description: What should Protocol Zero say now?
      placeholder: |
        Should we:
        - Update the description?
        - Add a warning?
        - Remove the tool?
        - Recommend an alternative?
    validations:
      required: true
      
  - type: input
    id: sources
    attributes:
      label: Sources
      description: "Links to verify this information"
      placeholder: "https://..."
    validations:
      required: false