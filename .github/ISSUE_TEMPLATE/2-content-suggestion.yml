name: "💡 Content Suggestion"
description: Suggest new content, expansions, or improvements
title: "[SUGGESTION] "
labels: ["enhancement", "content-suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        ## Suggest Content Improvement
        
        Have an idea for new content or improvements to existing sections? Share it here.
        
  - type: dropdown
    id: suggestion-type
    attributes:
      label: Type of Suggestion
      description: What are you proposing?
      options:
        - New chapter or section
        - Expand existing content
        - Add examples or use cases
        - Restructure for clarity
        - Add checklist or template
        - Other improvement
    validations:
      required: true
      
  - type: input
    id: location
    attributes:
      label: Related Section (if applicable)
      description: "Which part of Protocol Zero does this relate to?"
      placeholder: "e.g., Part II: Identity & Access, or new section"
    validations:
      required: false
      
  - type: textarea
    id: suggestion
    attributes:
      label: Your Suggestion
      description: Describe your idea in detail
      placeholder: |
        What should be added or changed?
        Why is this important?
        Who would benefit?
    validations:
      required: true
      
  - type: textarea
    id: proposed-content
    attributes:
      label: Proposed Content (optional)
      description: If you want to draft the content yourself, paste it here
      placeholder: "Your draft content in markdown format..."
    validations:
      required: false
      
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Are you willing to help write this content?
      options:
        - label: I can help write or research this content
        - label: I can review drafts if someone else writes it