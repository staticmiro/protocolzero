name: "📝 Report an Issue"
description: Report errors, suggest improvements, or propose new content
title: "[ISSUE] "
labels: ["needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        ## Report an Issue or Suggestion
        
        Use this to report:
        - Typos, errors, broken links
        - Outdated information (especially in Appendix A: Tools)
        - Suggestions for new content or improvements
        - Translation proposals
        
  - type: dropdown
    id: type
    attributes:
      label: What is this about?
      options:
        - "Error or typo"
        - "Outdated information"
        - "Broken link"
        - "Suggestion for improvement"
        - "New content proposal"
        - "Translation proposal"
        - "Tool/software update (Appendix A)"
    validations:
      required: true
      
  - type: input
    id: location
    attributes:
      label: Location
      description: "Which file or section?"
      placeholder: "e.g., protocol/en/02_identity_and_access.md - Chapter 2"
    validations:
      required: false
      
  - type: textarea
    id: description
    attributes:
      label: Description
      description: "Describe the issue or suggestion"
      placeholder: |
        Be specific:
        - What's wrong? or What should be added?
        - Why does this matter?
        - Any supporting links or sources?
    validations:
      required: true
      
  - type: textarea
    id: suggestion
    attributes:
      label: Your proposed solution (optional)
      description: "If you have a specific fix or content in mind, share it here"
      placeholder: "Your suggestion..."
    validations:
      required: false